name: Checkout branch validation
on:
  push:
    branches:
      - fix/security-checkout-audit
  workflow_dispatch:
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply npm advisory fixes to lockfile (one-time remediation)
        if: github.event.head_commit.message == 'security: activate one-time dependency remediation'
        run: |
          npm audit fix --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh dependency lockfile using npm audit fix"
            git push origin HEAD:fix/security-checkout-audit
          fi
      - name: Audit production dependencies for high and critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Check backend JavaScript syntax
        run: |
          find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend demo payment tests
        run: npm test --workspace=backend
      - name: Run MongoDB replica-set integration tests
        run: npm run test:integration --workspace=backend
      - name: Build frontend
        run: npm run build --workspace=frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser checkout E2E
        run: npm run test:e2e --workspace=frontend

      - name: Browser checkout E2E against real Express and MongoDB
        run: npm exec --workspace=frontend -- playwright test --config=playwright.real.config.js
